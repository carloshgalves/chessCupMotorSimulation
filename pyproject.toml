[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chesssim64"
version = "0.1.0"
description = "ChessCup Motor Simulation: torneios e estudo computacional de estilos de enxadristas"
requires-python = ">=3.11"
dependencies = ["chess>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
chesssim = "chesssim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chesssim.data" = ["roster.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_engine: requires an externally installed UCI chess engine configured with CHESSSIM_UCI_ENGINE",
]
