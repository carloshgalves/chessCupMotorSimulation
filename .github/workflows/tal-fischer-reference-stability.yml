name: Tal Fischer reference stability diagnosis d24

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/chesssim/reference_stability_adjudication.py'
      - 'tests/test_reference_stability_adjudication.py'
      - 'docs/TAL_FISCHER_REFERENCE_STABILITY.md'
      - '.github/workflows/tal-fischer-reference-stability.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: tal-fischer-reference-depth24-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.head_ref == 'science/tal-fischer-reference-stability-adjudication' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test immutable historical protocol and targeted diagnostic
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check src/chesssim/reference_stability_adjudication.py tests/test_reference_stability_adjudication.py
          python -m pytest -q tests/test_reference_stability_adjudication.py
      - name: Download exact prior 887-decision evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 45258562373
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: shard-*
          path: ${{ runner.temp }}/original-shards
      - uses: actions/download-artifact@v4
        with:
          run-id: 45258562373
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: full-historical-quality-parity-report
          path: ${{ runner.temp }}/original-report
      - name: Confirm source result is still INCONCLUSIVE; select all 21 anomalies and 21 controls
        run: |
          python -m chesssim.reference_stability_adjudication plan --fetch \
            --shards "$RUNNER_TEMP/original-shards" \
            --prior-report "$RUNNER_TEMP/original-report/human-move-quality-parity.json" \
            > "$RUNNER_TEMP/depth24-plan.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads((Path(os.environ["RUNNER_TEMP"])/"depth24-plan.json").read_text())
          assert p["schema"]=="chesssim-tal-fischer-reference-diagnostic-v1"
          assert p["source_run"]==45258562373
          assert p["source_positions"]==887
          assert p["source_flags"]==21
          assert p["flagged_peak"]=={"fischer":5,"tal":5}
          assert p["target_positions"]==42 and p["matched_controls"]==21
          assert p["reference_depth"]==24 and p["shards"]==4
          assert sum(p["per_shard"])==42
          assert p["may_approve_tal_or_fischer"] is False
          print("D24_DIAGNOSTIC_PLAN",json.dumps(p,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tal-fischer-depth24-diagnostic-plan
          path: ${{ runner.temp }}/depth24-plan.json
          retention-days: 30
          if-no-files-found: error

  adjudicate:
    if: github.head_ref == 'science/tal-fischer-reference-stability-adjudication' && github.event.pull_request.head.repo.full_name == github.repository
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare the same validated chess corpus and Stockfish reference
        run: |
          python -m pip install -e .
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
      - uses: actions/download-artifact@v4
        with:
          run-id: 45258562373
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: shard-*
          path: ${{ runner.temp }}/original-shards
      - uses: actions/download-artifact@v4
        with:
          run-id: 45258562373
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: full-historical-quality-parity-report
          path: ${{ runner.temp }}/original-report
      - name: Re-evaluate all assigned anomalous and matched-control boards at fixed d24
        timeout-minutes: 220
        run: |
          python -m chesssim.reference_stability_adjudication play --fetch \
            --shards "$RUNNER_TEMP/original-shards" \
            --prior-report "$RUNNER_TEMP/original-report/human-move-quality-parity.json" \
            --stockfish /usr/games/stockfish \
            --index ${{ matrix.index }} \
            --out "$RUNNER_TEMP/adjudication-${{ matrix.index }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adjudication-${{ matrix.index }}
          path: ${{ runner.temp }}/adjudication-${{ matrix.index }}/
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    if: github.head_ref == 'science/tal-fischer-reference-stability-adjudication' && github.event.pull_request.head.repo.full_name == github.repository
    needs: adjudicate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install original pinned Python chess implementation
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          run-id: 45258562373
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: shard-*
          path: ${{ runner.temp }}/original-shards
      - uses: actions/download-artifact@v4
        with:
          run-id: 45258562373
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: full-historical-quality-parity-report
          path: ${{ runner.temp }}/original-report
      - uses: actions/download-artifact@v4
        with:
          pattern: adjudication-*
          path: ${{ runner.temp }}/adjudication
      - name: Verify 42 depth24 positions against untouched source; never override release gate
        run: |
          python -m chesssim.reference_stability_adjudication aggregate --fetch \
            --shards "$RUNNER_TEMP/original-shards" \
            --prior-report "$RUNNER_TEMP/original-report/human-move-quality-parity.json" \
            --adjudication-shards "$RUNNER_TEMP/adjudication" \
            --out "$RUNNER_TEMP/reference-stability-diagnostic.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"reference-stability-diagnostic.json").read_text())
          assert p["source_run"]==45258562373
          assert p["original_status"]=="INCONCLUSIVE_NEEDS_HUMAN_QUALITY_SUPPORT"
          assert p["original_reference_instabilities"]==21
          assert p["rechecked_positions"]==42
          assert p["only_diagnostic"] and p["parity_approved"] is False
          assert p["tal_frozen"] is False and p["fischer_frozen_asset_unchanged"] is True
          assert p["status"]=="REFERENCE_INSTABILITY_DIAGNOSED_RELEASE_STILL_BLOCKED"
          print("D24_REFERENCE_DIAGNOSIS",json.dumps(p["diagnosis"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tal-fischer-depth24-reference-report
          path: ${{ runner.temp }}/reference-stability-diagnostic.json
          retention-days: 30
          if-no-files-found: warn
