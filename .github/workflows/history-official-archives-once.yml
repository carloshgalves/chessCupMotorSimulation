name: History archives - approved CC0 tournament batch
on:
  push:
    branches: [feat/history-remaining-players-47]
    paths: [.github/workflows/history-official-archives-once.yml, scripts/acquire_official_archive_portraits.py, src/chesssim/data/history/portrait_candidates.json]
permissions:
  contents: write
jobs:
  acquire:
    if: github.repository == 'carloshgalves/chessCupMotorSimulation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/history-remaining-players-47
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Pillow for one-time JPEG conversion
        run: python -m pip install 'Pillow>=11,<13'
      - name: Import from licensed Nationaal Archief / Noord-Hollands Archief
        run: python scripts/acquire_official_archive_portraits.py
      - name: Commit verified local photographs with provenance
        shell: bash
        run: |
          git add src/chesssim/data/history/*.json src/chesssim/data/history/portraits/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets(history): add CC0 chess tournament photos from original archives'
            git fetch origin feat/history-remaining-players-47
            git rebase origin/feat/history-remaining-players-47
            git push origin HEAD:feat/history-remaining-players-47
          fi
