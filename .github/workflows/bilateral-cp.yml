name: Bilateral CP qualification of all 64 historical players
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bilateral-cp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src/chesssim/bilateral_cp.py tests/test_bilateral_cp.py
      - run: python -m pytest -q tests/test_bilateral_cp.py
  fit:
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        player: [steinitz, lasker, capablanca, alekhine, euwe, botvinnik, smyslov, tal, petrosian, spassky, fischer, karpov, kasparov, kramnik, anand, carlsen, ding-liren, mequinho, mamedyarov, vachier-lagrave, grischuk, topalov, philidor, staunton, anderssen, morphy, zukertort, chigorin, pillsbury, tarrasch, marshall, rubinstein, nimzowitsch, reti, keres, bronstein, reshevsky, najdorf, geller, korchnoi, larsen, portisch, taimanov, polugaevsky, gligoric, ivanchuk, timman, short, kamsky, shirov, gelfand, leko, svidler, aronian, caruana, nakamura, karjakin, nepomniachtchi, wesley-so, kosteniuk, gaprindashvili, chiburdanidze, judit-polgar, hou-yifan]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/checkout@v5
        with:
          repository: nescitus/rodent-iv
          ref: e8d84c8c8c189a1cf4eb27c578fc573af3b916d2
          path: rodent-source
          persist-credentials: false
      - run: |
          mkdir -p rodent-source/mac "$RUNNER_TEMP/rodent"
          make -C rodent-source/sources build
          cp rodent-source/mac/rodentIV "$RUNNER_TEMP/rodent/rodent-iv-plain.exe"
          cp -R rodent-source/personalities rodent-source/books "$RUNNER_TEMP/rodent/"
          sudo apt-get update
          sudo apt-get install -y stockfish
      - run: python -m chesssim.bilateral_cp fit --player ${{ matrix.player }} --rodent "$RUNNER_TEMP/rodent" --stockfish /usr/games/stockfish --out result/selection.json
      - uses: actions/upload-artifact@v4
        with:
          name: cp-fit-${{ matrix.player }}
          path: result/selection.json
          if-no-files-found: error
  reserved:
    needs: fit
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        player: [steinitz, lasker, capablanca, alekhine, euwe, botvinnik, smyslov, tal, petrosian, spassky, fischer, karpov, kasparov, kramnik, anand, carlsen, ding-liren, mequinho, mamedyarov, vachier-lagrave, grischuk, topalov, philidor, staunton, anderssen, morphy, zukertort, chigorin, pillsbury, tarrasch, marshall, rubinstein, nimzowitsch, reti, keres, bronstein, reshevsky, najdorf, geller, korchnoi, larsen, portisch, taimanov, polugaevsky, gligoric, ivanchuk, timman, short, kamsky, shirov, gelfand, leko, svidler, aronian, caruana, nakamura, karjakin, nepomniachtchi, wesley-so, kosteniuk, gaprindashvili, chiburdanidze, judit-polgar, hou-yifan]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: cp-fit-${{ matrix.player }}
          path: input
      - uses: actions/checkout@v5
        with:
          repository: nescitus/rodent-iv
          ref: e8d84c8c8c189a1cf4eb27c578fc573af3b916d2
          path: rodent-source
          persist-credentials: false
      - run: |
          mkdir -p rodent-source/mac "$RUNNER_TEMP/rodent"
          make -C rodent-source/sources build
          cp rodent-source/mac/rodentIV "$RUNNER_TEMP/rodent/rodent-iv-plain.exe"
          cp -R rodent-source/personalities rodent-source/books "$RUNNER_TEMP/rodent/"
          sudo apt-get update
          sudo apt-get install -y stockfish
      - run: python -m chesssim.bilateral_cp reserved --player ${{ matrix.player }} --rodent "$RUNNER_TEMP/rodent" --stockfish /usr/games/stockfish --selection input/selection.json --out result/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: cp-reserved-${{ matrix.player }}
          path: result/report.json
          if-no-files-found: error
  table:
    needs: [protocol, fit, reserved]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: cp-reserved-*
          path: shards
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: cp-fit-*
          path: shards
      - run: python -m chesssim.bilateral_cp aggregate --shards shards --out table
      - uses: actions/upload-artifact@v4
        with:
          name: cp-qualified-candidate-table
          path: table/
          if-no-files-found: error
