name: Product historical repertoires
on:
  pull_request:
    paths:
      - 'src/chesssim/product_repertoires.py'
      - 'tests/test_product_repertoires.py'
      - '.github/workflows/product-repertoires.yml'
      - 'docs/PRODUCT_PERSONALITY_PROTOCOL.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  books:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          python -m pip install -e '.[dev]'
          python -m ruff check src/chesssim/product_repertoires.py tests/test_product_repertoires.py
          python -m pytest -q tests/test_product_repertoires.py
          python -m chesssim.product_repertoires --out "$RUNNER_TEMP/product-books"
      - uses: actions/upload-artifact@v4
        with:
          name: product-historical-books
          path: ${{ runner.temp }}/product-books/
          if-no-files-found: error
