name: Historical real-PGN research pilot (4 players)

on:
  pull_request:
    paths:
      - 'src/chesssim/historical_real_corpus.py'
      - 'tests/test_historical_real_corpus.py'
      - '.github/workflows/real-historical-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chesssim-real-historical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-historical-8915:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install python-chess and project
        run: python -m pip install -e '.[dev]'
      - name: Run regression tests for real-corpus parser
        run: python -m pytest tests/test_historical_real_corpus.py -q -ra
      - name: Download and process four actual historical PGN collections
        env:
          AUDIT_PATH: ${{ runner.temp }}/real-historical-audit.json
        run: |
          python -m chesssim.historical_real_corpus --fetch --out "$AUDIT_PATH" --min-ply 17
      - name: Enforce large REAL-data evidence gate and check reporting
        env:
          AUDIT_PATH: ${{ runner.temp }}/real-historical-audit.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ["AUDIT_PATH"]).read_text(encoding="utf-8"))
          assert report["total_unique_cohort_games"] >= 6500
          assert report["total_training_games"] >= 3500
          assert len(report["sources"]) == 4
          assert len(report["shared_fen_pairs"]) == 6
          for name in ("Fischer", "Tal", "Karpov", "Kasparov"):
              cohort = report["sources"][name]
              assert cohort["unique_games"] >= 500
              assert cohort["partitions"]["train"]["games"] > 0
              assert cohort["partitions"]["holdout"]["games"] > 0
          assert report["status"].startswith("REAL_HISTORICAL_PUBLIC_PGN_")
          assert "NOT_STYLE_VALIDATED" in report["status"]
          print("REAL-PGN gate PASS:", report["total_unique_cohort_games"], "unique games;",
                report["total_training_games"], "train games")
          PY
      - name: Upload aggregated SHA evidence (never raw PGNs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-historical-four-cohort-aggregates
          path: ${{ runner.temp }}/real-historical-audit.json
          if-no-files-found: warn
          retention-days: 7
