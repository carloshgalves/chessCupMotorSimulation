name: Morphy and Philidor supplemental corpus audit
on:
  pull_request:
    paths:
      - '.github/workflows/pioneer-corpus-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        player: [morphy, philidor]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          python -m pip install -e .
          python -m chesssim.pioneer_corpus_audit --player ${{ matrix.player }} --out "$RUNNER_TEMP/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.player }}
          path: ${{ runner.temp }}/report.json
          if-no-files-found: error
