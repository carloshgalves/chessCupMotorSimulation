name: History portraits - batch two licensed acquisition
on:
  push:
    branches:
      - feat/history-remaining-players-47
    paths:
      - .github/workflows/history-portraits-expand-once.yml
      - scripts/materialize_history_portraits.py
permissions:
  contents: write
jobs:
  acquire:
    if: github.repository == 'carloshgalves/chessCupMotorSimulation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/history-remaining-players-47
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install 'Pillow>=11,<13'
      - name: Check licenses and import only missing sources
        run: python scripts/materialize_history_portraits.py --apply
      - name: Commit JPEGs and immutable provenance records to feature branch
        run: |
          git add src/chesssim/data/history/*.json src/chesssim/data/history/portraits/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets(history): import additional verified tournament portraits'
            git fetch origin feat/history-remaining-players-47
            git rebase origin/feat/history-remaining-players-47
            git push origin HEAD:feat/history-remaining-players-47
          fi
