name: Real85 historical singleton opening-support ablation

on:
  pull_request:
    paths:
      - 'src/chesssim/real85_playable.py'
      - 'src/chesssim/real85_roundrobin.py'
      - 'tests/test_real85_playable.py'
      - 'tests/test_real85_roundrobin.py'
      - '.github/workflows/real85-opening-support-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real85-opening-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real85-opening-support:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Unit negative controls
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_real85_playable.py tests/test_real85_roundrobin.py
      - name: Fit full 85% real PGN train population
        run: |
          python -m chesssim.real85_playable fit --fetch \
            --players fischer tal karpov kasparov \
            --max-opening-plies 40 \
            --out "$RUNNER_TEMP/historical-fit"
      - uses: actions/checkout@v5
        with:
          repository: nescitus/rodent-iv
          ref: e8d84c8c8c189a1cf4eb27c578fc573af3b916d2
          path: rodent-source
          persist-credentials: false
      - name: Build ORIGINAL Rodent IV UCI
        run: |
          test "$(git -C rodent-source rev-parse HEAD)" = e8d84c8c8c189a1cf4eb27c578fc573af3b916d2
          mkdir -p rodent-source/mac
          make -C rodent-source/sources build
          mkdir -p "$RUNNER_TEMP/rodent"
          cp rodent-source/mac/rodentIV "$RUNNER_TEMP/rodent/rodent-iv-plain.exe"
          cp -R rodent-source/personalities "$RUNNER_TEMP/rodent/"
          cp -R rodent-source/books "$RUNNER_TEMP/rodent/"
      - name: Compare genuine 1-observation vs 2-observation historical openings against free Simple
        run: |
          python -m chesssim.real85_playable play \
            --rodent-root "$RUNNER_TEMP/rodent" \
            --profiles "$RUNNER_TEMP/historical-fit" \
            --players fischer tal karpov kasparov \
            --opening-min-count 1 --depth 4 --max-plies 450 \
            --out "$RUNNER_TEMP/book-support-one"
          python -m chesssim.real85_playable play \
            --rodent-root "$RUNNER_TEMP/rodent" \
            --profiles "$RUNNER_TEMP/historical-fit" \
            --players fischer tal karpov kasparov \
            --opening-min-count 2 --depth 4 --max-plies 450 \
            --out "$RUNNER_TEMP/book-support-two"
          python - <<'PY'
          from pathlib import Path
          import os,json
          root=Path(os.environ["RUNNER_TEMP"])
          a=json.loads((root/"book-support-one"/"results.json").read_text())
          b=json.loads((root/"book-support-two"/"results.json").read_text())
          assert a["opening_min_observations"]==1
          assert b["opening_min_observations"]==2
          assert a["seed_opponent_historical_book"] is False
          assert b["seed_opponent_historical_book"] is False
          assert a["rodent_binary_sha256"]==b["rodent_binary_sha256"]
          assert len(a["games"])==len(b["games"])==8
          assert all(g["status"]=="COMPLETED" for g in a["games"]+b["games"])
          assert all(g["opponent_historical_opening_moves"]==0 for g in a["games"]+b["games"])
          print("REAL_85_SUPPORT_ABLATION_16_COMPLETE",{
              s:{"min1_book_plies":a["players"][s]["focal_book_plies_played"],
                 "min2_book_plies":b["players"][s]["focal_book_plies_played"],
                 "min1_points_vs_simple":a["players"][s]["points_vs_simple"],
                 "min2_points_vs_simple":b["players"][s]["points_vs_simple"]}
              for s in a["players"]})
          PY
      - name: Independent Stockfish diagnostic of both real played PGNs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          python -m chesssim analyze-quality \
            --pgn "$RUNNER_TEMP/book-support-one/played.pgn" \
            --stockfish /usr/games/stockfish --depth 8 \
            --max-positions 64 --min-fullmove 8 --pv-plies 5 \
            --out "$RUNNER_TEMP/book-support-one-quality.json"
          python -m chesssim analyze-quality \
            --pgn "$RUNNER_TEMP/book-support-two/played.pgn" \
            --stockfish /usr/games/stockfish --depth 8 \
            --max-positions 64 --min-fullmove 8 --pv-plies 5 \
            --out "$RUNNER_TEMP/book-support-two-quality.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          for n in ("one","two"):
              doc=json.loads((root/f"book-support-{n}-quality.json").read_text())
              assert doc["status"]=="EXPLORATORY_STRENGTH_DIAGNOSTIC_NOT_ELO"
              assert doc["reconciliation"]["status"]=="CONSISTENT"
              assert doc["independent_decisions_sampled"]>=16
              print("REAL_BOOK_SUPPORT_STOCKFISH",n,doc["summary"])
          PY
      - name: Publish authentic PGNs and tactical quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real85-opening-support-one-vs-two-full-uci
          path: |
            ${{ runner.temp }}/historical-fit/report.json
            ${{ runner.temp }}/book-support-one/results.json
            ${{ runner.temp }}/book-support-one/played.pgn
            ${{ runner.temp }}/book-support-two/results.json
            ${{ runner.temp }}/book-support-two/played.pgn
            ${{ runner.temp }}/book-support-one-quality.json
            ${{ runner.temp }}/book-support-two-quality.json
          retention-days: 14
