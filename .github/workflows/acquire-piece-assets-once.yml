name: One-shot reviewed chess SVG acquisition

on:
  push:
    branches: [feat/board-presentation-preferences-68]
    paths: [.github/workflows/acquire-piece-assets-once.yml]

permissions:
  contents: write

concurrency:
  group: board-svg-acquisition-once
  cancel-in-progress: false

jobs:
  import-reviewed-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch pinned originals from Lichess without mirrors or retries
        run: python scripts/acquire_piece_svgs_once.py
      - name: Check in verified exact SVG bytes
        shell: bash
        run: |
          set -euo pipefail
          git add src/chesssim/data/pieces
          test "$(git diff --cached --name-only | grep -cE '^src/chesssim/data/pieces/(cburnett|merida|chessnut|fantasy|spatial|celtic|rhosgfx)/[wb][KQRBNP]\.svg$')" -eq 84
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'assets(board): add 84 verified upstream SVG chess pieces (#68)'
          git push origin HEAD:feat/board-presentation-preferences-68
