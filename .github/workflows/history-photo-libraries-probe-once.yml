name: History Cleveland chess portrait title-only results
on:
  push:
    branches: [feat/history-remaining-players-47]
    paths: [.github/workflows/history-photo-libraries-probe-once.yml]
permissions: {contents: read}
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Find historical portrait items by title without downloading
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from urllib.parse import quote
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          names=["Staunton","Pillsbury","Marshall","Rubinstein","Réti","Reti","Philidor","Lasker","Nimzowitsch","Tarrasch","Alekhine","Fischer","Menchik","Capablanca","Steinitz","Anderssen","Zukertort","Chigorin"]
          host="https://cplorg.contentdm.oclc.org"
          for name in names:
            path="/digital/api/search/searchterm/"+quote(name)+"/field/title/mode/all/conn/and/maxRecords/24"
            try:
              with urlopen(Request(host+path,headers={"User-Agent":"ChessSimulation/1.0 (+https://github.com/carloshgalves/chessCupMotorSimulation)"}),timeout=15) as h:
                j=json.loads(h.read(150000))
                items=j.get("items",[])
                print("NAME",name,"TOTAL",j.get("totalResults"),"MATCHES",[(k.get("itemId"),k.get("title"),next((x.get("value") for x in k.get("metadataFields",[]) if x.get("field")=="date"),None)) for k in items][:24],flush=True)
            except HTTPError as e:
              print("BLOCK",name,e.code,flush=True)
              if e.code in (401,403,429,451):break
            except Exception as e:
              print("ERROR",name,type(e).__name__,str(e)[:180],flush=True)
            time.sleep(.24)
          PY