name: History Nationaal Archief original image endpoint one-time check
on:
  push:
    branches: [feat/history-remaining-players-47]
    paths: [.github/workflows/history-photo-libraries-probe-once.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test official alternative file endpoint, one request per path
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          urls={
            "fischer-1971-original":"https://service.archief.nl/gaf/api/file/v1/original/9f9027bd-37bf-4d40-a958-b9dab67146ef",
            "fischer-1972-original":"https://service.archief.nl/gaf/api/file/v1/original/f0bfb12b-052e-45cf-8b85-8bb031712db7",
            "fischer-1972b-original":"https://service.archief.nl/gaf/api/file/v1/original/652a5f33-b2fb-4187-b394-7616507be504",
          }
          block=False
          for name,url in urls.items():
            if block: break
            try:
              with urlopen(Request(url,headers={"User-Agent":"ChessSimulation/1.0 (+https://github.com/carloshgalves/chessCupMotorSimulation)","Accept":"image/jpeg"}),timeout=13) as r:
                d=r.read(10000)
                print("OFFICIAL",name,r.status,r.headers.get("Content-Type"),repr(d[:20]),flush=True)
            except HTTPError as e:
              print("OFFICIAL_ERROR",name,e.code,flush=True)
              if e.code in (401,403,429,451):block=True
            except Exception as e:
              print("OFFICIAL_ERROR",name,type(e).__name__,str(e)[:140],flush=True)
          PY