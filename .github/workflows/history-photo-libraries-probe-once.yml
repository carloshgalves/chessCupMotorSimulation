name: History permissions and official-media endpoint diagnostic
on:
  push:
    branches: [feat/history-remaining-players-47]
    paths: [.github/workflows/history-photo-libraries-probe-once.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect 3 library rights records and 3 official Fischer photo pages
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from html import unescape
          import json,re
          hosts_blocked=set()
          for slug,id in [("nimzowitsch",75),("marshall_reti",108)]:
            url=f"https://cplorg.contentdm.oclc.org/digital/api/singleitem/collection/p4014coll20/id/{id}"
            try:
              with urlopen(Request(url,headers={"User-Agent":"ChessSimulation/1.0 (+https://github.com/carloshgalves/chessCupMotorSimulation)"}),timeout=12) as rsp:
                obj=json.loads(rsp.read(40000))
                print("CLEVELAND",slug,[(e["key"],str(e.get("value"))[:900]) for e in obj.get("fields",[]) if e["key"] in ("title","date","rights","rightsl","standa","rightsn","creato","origin")],flush=True)
            except HTTPError as e:
              print("DENY_CLEVELAND",e.code,flush=True)
              if e.code in (401,403,429,451):break
          for slug,url in [
            ("fischer-1971","https://www.nationaalarchief.nl/onderzoeken/fotocollectie/abc6ac60-d0b4-102d-bcf8-003048976d84"),
            ("fischer-1972","https://www.nationaalarchief.nl/onderzoeken/fotocollectie/abdf9752-d0b4-102d-bcf8-003048976d84"),
            ("fischer-1972b","https://www.nationaalarchief.nl/onderzoeken/fotocollectie/abdf9680-d0b4-102d-bcf8-003048976d84")]:
            try:
              with urlopen(Request(url,headers={"User-Agent":"ChessSimulation/1.0 (+https://github.com/carloshgalves/chessCupMotorSimulation)"}),timeout=12) as rsp:
                page=unescape(rsp.read(300000).decode("utf-8","replace"))
              for _ in range(4):page=page.replace("\\/","/")
              print("NATION",slug,"CC0",("Nationaal Archief, CC0" in page),"DATES",[v in page for v in ("1971-07-15","1972-01-31")],"IDS",re.findall(r"/gaf/api/file/v1/(?:original|default)/([0-9a-f-]{36})",page)[:3],flush=True)
            except HTTPError as e:
              print("NATION_DENIED",slug,e.code,flush=True)
              if e.code in (401,403,429,451):break
          PY