name: Fischer paired position calibration

on:
  pull_request:
    paths:
      - 'src/chesssim/fischer_position_calibration.py'
      - 'tests/test_fischer_position_calibration.py'
      - '.github/workflows/fischer-position-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fischer-position-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-real:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify paired scoring and partitions
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_fischer_position_calibration.py tests/test_fischer_baseline.py
      - uses: actions/checkout@v5
        with:
          repository: nescitus/rodent-iv
          ref: e8d84c8c8c189a1cf4eb27c578fc573af3b916d2
          path: rodent-source
          persist-credentials: false
      - name: Compile pinned Rodent and install independent Stockfish
        run: |
          test "$(git -C rodent-source rev-parse HEAD)" = e8d84c8c8c189a1cf4eb27c578fc573af3b916d2
          mkdir -p rodent-source/mac "$RUNNER_TEMP/rodent"
          make -C rodent-source/sources build
          cp rodent-source/mac/rodentIV "$RUNNER_TEMP/rodent/rodent-iv-plain.exe"
          cp -R rodent-source/personalities "$RUNNER_TEMP/rodent/"
          cp -R rodent-source/books "$RUNNER_TEMP/rodent/"
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
      - name: Compare actual human decisions and six Rodent policies
        run: |
          python -m chesssim.fischer_position_calibration --fetch \
            --rodent-root "$RUNNER_TEMP/rodent" --stockfish /usr/games/stockfish \
            --out "$RUNNER_TEMP/fischer-paired.json"
      - name: Reconcile every matched denominator and report per phase
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from chesssim.fischer_position_calibration import CANDIDATES
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"fischer-paired.json").read_text())
          assert report["status"]=="FISCHER_PAIRED_POSITION_DIAGNOSTIC_NOT_ELO"
          assert report["outer_test_decisions_evaluated"]==0
          assert report["expected_games"]=={"peak_fit":126,"tune":23}
          assert report["reference_depth"]==16 and report["book_enabled"] is False
          for arm,panel in report["panels"].items():
              total=panel["all"]
              assert 0<total["games"]<=report["expected_games"][arm]
              assert total["games"]<=total["positions"]<=3*report["expected_games"][arm]
              assert sum(p["positions"] for p in panel["by_phase"].values())==total["positions"]
              for cell in [total,*panel["by_phase"].values(),*panel["by_context"].values()]:
                  assert set(cell["policies"])=={"human",*CANDIDATES}
                  for policy,stats in cell["policies"].items():
                      assert stats["decisions"]==cell["positions"]
                      assert stats["nonmate_count"]+stats["mate_sensitive_count"]==cell["positions"]
                      assert stats["paired_nonmate_count"]<=stats["nonmate_count"]
              print("FISCHER_PAIRED",arm,json.dumps(total,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fischer-paired-position-aggregates
          path: ${{ runner.temp }}/fischer-paired.json
          retention-days: 14
          if-no-files-found: warn
