name: True historical TEST-only endgames against Rodent and Stockfish

on:
  pull_request:
    paths:
      - 'src/chesssim/real85_endgame_audit.py'
      - 'tests/test_real85_endgame_audit.py'
      - '.github/workflows/real85-heldout-endgames.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real85-endgame-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real85-test-endgame-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Negative controls and source-locked TEST fixture
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_real85_endgame_audit.py tests/test_real85_playable.py
      - name: Rebuild 85pct real PGN profile manifest (no training on TEST)
        run: |
          python -m chesssim.real85_playable fit --fetch \
            --players fischer tal karpov kasparov \
            --max-opening-plies 40 \
            --out "$RUNNER_TEMP/real85-fitted"
      - name: Extract real test-game material-endgame decisions without fitting
        run: |
          python -m chesssim.real85_endgame_audit extract --fetch \
            --profiles "$RUNNER_TEMP/real85-fitted" \
            --players fischer tal karpov kasparov \
            --per-player 0 \
            --out "$RUNNER_TEMP/real85-test-endgame-positions.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          report=json.loads((root/"real85-test-endgame-positions.json").read_text())
          fit=json.loads((root/"real85-fitted"/"report.json").read_text())
          assert report["schema"]=="chesssim-real85-heldout-material-endgame-test-only-v1"
          assert report["trained_on_test"] is False and report["old_year_holdout_used"] is False
          assert set(report["players"])=={"fischer","tal","karpov","kasparov"}
          for slug,row in report["players"].items():
              assert row["test_games"]==fit["players"][slug]["test_games"]
              assert row["source_pgn_sha256"]==fit["players"][slug]["source_pgn_sha256"]
              assert row["sampled_distinct_games"] >= 1, (slug,row["status"])
              assert row["sampled_distinct_games"] == row["test_endgame_games_available"]
              assert len({x["game_sha256"] for x in row["sampled_decisions"]})==row["sampled_distinct_games"]
              assert row["sampled_distinct_games"]<=row["test_endgame_games_available"]
              print("REAL_TEST_ENDGAME_CORPUS",slug,"test_games",row["test_games"],
                    "endgame_games",row["test_endgame_games_available"],
                    "endgame_decisions",row["test_endgame_decisions_available"],
                    "sampled",row["sampled_distinct_games"])
          PY
      - uses: actions/checkout@v5
        with:
          repository: nescitus/rodent-iv
          ref: e8d84c8c8c189a1cf4eb27c578fc573af3b916d2
          path: rodent-source
          persist-credentials: false
      - name: Build original Rodent IV and independent Stockfish
        run: |
          test "$(git -C rodent-source rev-parse HEAD)" = e8d84c8c8c189a1cf4eb27c578fc573af3b916d2
          mkdir -p rodent-source/mac
          make -C rodent-source/sources build
          mkdir -p "$RUNNER_TEMP/rodent"
          cp rodent-source/mac/rodentIV "$RUNNER_TEMP/rodent/rodent-iv-plain.exe"
          cp -R rodent-source/personalities "$RUNNER_TEMP/rodent/"
          cp -R rodent-source/books "$RUNNER_TEMP/rodent/"
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          test -x /usr/games/stockfish
      - name: Run actual Rodent and Stockfish on the SAME real held-out endgames
        run: |
          python -m chesssim.real85_endgame_audit audit \
            --positions "$RUNNER_TEMP/real85-test-endgame-positions.json" \
            --profiles "$RUNNER_TEMP/real85-fitted" \
            --rodent-root "$RUNNER_TEMP/rodent" \
            --stockfish /usr/games/stockfish \
            --rodent-depth 4 --stockfish-depth 8 \
            --out "$RUNNER_TEMP/real85-test-endgame-quality.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          doc=json.loads((root/"real85-test-endgame-quality.json").read_text())
          assert doc["schema"]=="chesssim-real85-rodent-stockfish-historical-endgames-v1"
          assert doc["training_or_parameter_selection_performed"] is False
          assert doc["comparison"]=="same_root_fen_and_depth_with_forced_historical_and_rodent_root_moves"
          assert len(doc["rodent_binary_sha256"])==len(doc["stockfish_binary_sha256"])==64
          assert set(doc["players"])=={"fischer","tal","karpov","kasparov"}
          assert sum(row["sampled_distinct_games"] for row in doc["players"].values())>=300
          for slug,row in doc["players"].items():
              n=row["sampled_distinct_games"]
              assert n >= 1
              assert len(row["observations"])==n
              assert 0<=row["same_historical_move"]<=n
              assert all(x["historical_uci"] and x["rodent_uci"] for x in row["observations"])
              print("REAL_HISTORICAL_ENDGAME_DIAGNOSTIC",slug,
                    "game_disjoint",n,"same_human_move",row["same_historical_move"],
                    "nonmate_rodent_cpl",row["nonmate_mean_rodent_cp_loss"],
                    "nonmate_historical_cpl",row["nonmate_mean_historical_cp_loss"],
                    "real_tactical_blunders",row["rodent_blunders_over_250cp_nonmate"])
          PY
      - name: Preserve genuine TEST samples and per-game independent scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chesssim-real85-historical-test-endgame-quality-v1
          path: |
            ${{ runner.temp }}/real85-test-endgame-positions.json
            ${{ runner.temp }}/real85-test-endgame-quality.json
          retention-days: 14
