name: Four historical profiles on TRUE DSC150 full softmax (CPU)

on:
  pull_request:
    paths:
      - 'src/chesssim/dsc_true_probability_style.py'
      - 'tests/test_dsc_true_probability_style.py'
      - '.github/workflows/science-dsc-full-softmax-style.yml'
      - 'docs/DSC_TRUE_PROBABILITY_STYLES.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsc-full-softmax-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  four-historical-original-probabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_dsc_true_probability_style.py
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/checkout@v5
        with:
          repository: ChessDS/chessds-dsc
          ref: 229ef4291c38c088a9fd3a410e4c0e926a20cea1
          path: dsc-source
          persist-credentials: false
      - run: |
          python -m pip install -e ./dsc-source
          test "$(git -C dsc-source rev-parse HEAD)" = 229ef4291c38c088a9fd3a410e4c0e926a20cea1
      - name: Reconstruct pinned real four-player FIT/TUNE/AUDIT corpus
        run: |
          python -m chesssim.real_training_cohorts --fetch \
            --players fischer tal karpov kasparov \
            --birthdates-json docs/REAL_BIRTHDATES_4.json \
            --split-policy career-stratified --min-ply 17 \
            --out "$RUNNER_TEMP/cohorts"
          python -m chesssim.contextual_policy_v3 train \
            --cohorts "$RUNNER_TEMP/cohorts" \
            --max-per-player 1600 --max-per-game 3 --seed 2026 \
            --out "$RUNNER_TEMP/v3-binding.json"
          python -m chesssim.maia_personalization_v7 fit \
            --cohorts "$RUNNER_TEMP/cohorts" \
            --v3-model "$RUNNER_TEMP/v3-binding.json" \
            --out "$RUNNER_TEMP/fit-weights.json"
      - name: Evaluate genuine model probabilities, train-only fit/audit
        run: |
          python -m chesssim.dsc_true_probability_style \
            --cohorts "$RUNNER_TEMP/cohorts" \
            --v3-model "$RUNNER_TEMP/v3-binding.json" \
            --adapter "$RUNNER_TEMP/fit-weights.json" --fetch \
            --out "$RUNNER_TEMP/real-full-policy-style.json"
      - name: Require no final test and no fabricated policy probabilities
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"real-full-policy-style.json").read_text())
          assert r["final_holdout_opened"] is False
          assert r["official_personality_promotion"]=="DENIED"
          assert r["sum_genuine_fit_decisions"]>100000
          assert set(r["players"])=={"fischer","karpov","kasparov","tal"}
          assert r["blind_identity"]["status"] in ("DIAGNOSTIC_4_WAY_BLIND_CLASSIFIER","UNDERPOWERED")
          print("REAL_FULL_DSC_PROBABILITIES_STYLE_DIAGNOSTIC",r["report_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chesssim-four-dsc-original-softmax-personality-probe
          path: ${{ runner.temp }}/real-full-policy-style.json
          if-no-files-found: warn
          retention-days: 7
