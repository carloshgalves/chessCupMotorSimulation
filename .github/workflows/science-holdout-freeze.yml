name: Final holdout access requires reviewed frozen protocol

on:
  pull_request:
    paths:
      - 'src/chesssim/scientific_holdout_gate.py'
      - 'src/chesssim/real_policy_experiment.py'
      - 'tests/test_real_policy_experiment.py'
      - 'tests/test_scientific_holdout_gate.py'
      - '.github/workflows/science-holdout-freeze.yml'
      - 'docs/SCIENTIFIC_HOLDOUT_FREEZE.md'

permissions:
  contents: read

jobs:
  final-gate-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_scientific_holdout_gate.py tests/test_real_policy_experiment.py
      - name: Test final holdout policy is physically sealed by default
        run: |
          python - <<'PY'
          from chesssim.scientific_holdout_gate import TRUSTED_FROZEN_PREREGISTRATIONS
          assert not TRUSTED_FROZEN_PREREGISTRATIONS
          print("FINAL_HOLDOUT_FROZEN_WITH_NO_APPROVED_PROTOCOLS")
          PY
