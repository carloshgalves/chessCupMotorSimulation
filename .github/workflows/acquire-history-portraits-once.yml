name: One-shot licensed history portrait acquisition

on:
  push:
    branches: [feat/history-remaining-players-47]
    paths:
      - .github/workflows/acquire-history-portraits-once.yml

permissions:
  contents: write

concurrency:
  group: history-portrait-acquisition-once
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'Pillow>=11,<13' '.[dev]'
      - name: Acquire public originals once (stop on provider denial)
        run: python scripts/acquire_six_history_portraits_once.py
      - name: Verify portrait contracts and photo hashes
        run: python -m pytest -q tests/test_history_profiles.py
      - name: Check in only successful verified acquisitions
        shell: bash
        run: |
          git add src/chesssim/data/history
          if git diff --cached --quiet; then
            echo 'No source image was acquired; no auto-commit'
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m 'feat(history): incorporate verified licensed portraits (#47)'
            git push origin HEAD:feat/history-remaining-players-47
          fi
