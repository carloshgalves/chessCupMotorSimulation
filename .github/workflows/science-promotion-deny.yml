name: Scientific promotion remains deny-by-default

on:
  pull_request:
    paths:
      - 'src/chesssim/scientific_promotion_guard.py'
      - 'tests/test_scientific_promotion_guard.py'
      - '.github/workflows/science-promotion-deny.yml'
      - 'docs/FINAL_HOLDOUT_AND_PROMOTION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-unapproved-promotions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_scientific_promotion_guard.py
      - name: Assert no historical model was authorized by accident
        run: |
          python - <<'PY'
          from chesssim.scientific_promotion_guard import TRUSTED_FINAL_REPORTS
          assert TRUSTED_FINAL_REPORT_SHA256 == {}
          print("FINAL_HOLDOUT_NOT_CERTIFIED_ALL_MODELS_DENIED")
          PY
