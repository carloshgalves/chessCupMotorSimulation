name: History Met Philidor open access - one shot
on:
  push:
    branches: [feat/history-remaining-players-47]
    paths: [.github/workflows/history-met-philidor-once.yml]
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/history-remaining-players-47
          persist-credentials: true
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/acquire_met_philidor.py
      - name: Publish signed-off open access derivative
        shell: bash
        run: |
          git add src/chesssim/data/history/philidor.json src/chesssim/data/history/portraits/philidor.jpg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets(history): add Met CC0 Philidor engraving'
            git fetch origin feat/history-remaining-players-47
            git rebase origin/feat/history-remaining-players-47
            git push origin HEAD:feat/history-remaining-players-47
          fi
