name: History Flickr photographer - licensed tournament batch
on:
  push:
    branches: [feat/history-remaining-players-47]
    paths: [.github/workflows/history-flickr-once.yml, scripts/acquire_flickr_history_portraits.py, src/chesssim/data/history/portrait_candidates.json]
permissions:
  contents: write
jobs:
  acquire:
    if: github.repository == 'carloshgalves/chessCupMotorSimulation'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/history-remaining-players-47
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: JPEG decoder for one-time content curation
        run: python -m pip install 'Pillow>=11,<13'
      - name: Verify CC license on original photographer's Flickr pages
        run: python scripts/acquire_flickr_history_portraits.py
      - name: Commit source-attributed tournament JPEGs
        shell: bash
        run: |
          git add src/chesssim/data/history/*.json src/chesssim/data/history/portraits/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets(history): add photographer-licensed tournament portraits from Flickr'
            git fetch origin feat/history-remaining-players-47
            git rebase origin/feat/history-remaining-players-47
            git push origin HEAD:feat/history-remaining-players-47
          fi
