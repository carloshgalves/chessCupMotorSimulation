name: History Cleveland public-domain portraits - one shot
on:
  push:
    branches: [feat/history-remaining-players-47]
    paths: [.github/workflows/history-cleveland-import-once.yml, scripts/acquire_cleveland_history_portraits.py]
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/history-remaining-players-47
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Pillow for archive IIIF image conversion
        run: python -m pip install 'Pillow>=11,<13'
      - name: Rights-check original catalog and import individual historical pictures
        run: python scripts/acquire_cleveland_history_portraits.py
      - name: Commit approved photo derivatives
        shell: bash
        run: |
          git add src/chesssim/data/history/*.json src/chesssim/data/history/portraits/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets(history): import Cleveland archival portraits with public-domain marking'
            git fetch origin feat/history-remaining-players-47
            git rebase origin/feat/history-remaining-players-47
            git push origin HEAD:feat/history-remaining-players-47
          fi
