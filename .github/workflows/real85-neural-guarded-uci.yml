name: Actual four-player historical neural-style UCI games with shallow Stockfish guard

on:
  pull_request:
    paths:
      - 'src/chesssim/real85_neural_guarded_uci.py'
      - 'tests/test_real85_neural_guarded_uci.py'
      - '.github/workflows/real85-neural-guarded-uci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real85-neural-guarded-uci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authentic-neural-uci:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify all tactical safety gates and official-clock rejection
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_real85_neural_guarded_uci.py
      - name: Reconstruct authentic first-four full historical FIT trajectories
        run: |
          python -m chesssim.real85_neural_stream build --fetch \
            --players fischer tal karpov kasparov \
            --out "$RUNNER_TEMP/real85-four-input"
      - name: Actually train all four low-rank residuals on all real FIT decisions
        run: |
          python -m chesssim.real85_online_residual \
            --inputs "$RUNNER_TEMP/real85-four-input" \
            --players fischer tal karpov kasparov \
            --out "$RUNNER_TEMP/four-neural-trained"
      - uses: actions/checkout@v5
        with:
          repository: nescitus/rodent-iv
          ref: e8d84c8c8c189a1cf4eb27c578fc573af3b916d2
          path: rodent-source
          persist-credentials: false
      - name: Build untouched Rodent IV original and install independent Stockfish
        run: |
          test "$(git -C rodent-source rev-parse HEAD)" = e8d84c8c8c189a1cf4eb27c578fc573af3b916d2
          mkdir -p rodent-source/mac
          make -C rodent-source/sources build
          mkdir -p "$RUNNER_TEMP/rodent"
          cp rodent-source/mac/rodentIV "$RUNNER_TEMP/rodent/rodent-iv-plain.exe"
          cp -R rodent-source/personalities "$RUNNER_TEMP/rodent/"
          cp -R rodent-source/books "$RUNNER_TEMP/rodent/"
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          test -x /usr/games/stockfish
      - name: Run actual legal UCI games - paired SHADOW vs neural GUIDED, reversed colors
        run: |
          python -m chesssim.real85_neural_guarded_uci \
            --rodent-root "$RUNNER_TEMP/rodent" \
            --stockfish /usr/games/stockfish \
            --weights "$RUNNER_TEMP/four-neural-trained" \
            --players fischer tal karpov kasparov \
            --rodent-depth 4 --stockfish-depth 8 \
            --cp-budget 25 --min-ply 21 --max-plies 450 \
            --out "$RUNNER_TEMP/four-neural-uci"
          python - <<'PY'
          from pathlib import Path
          import json,os
          root=Path(os.environ["RUNNER_TEMP"])
          data=json.loads((root/"four-neural-uci/results.json").read_text())
          assert data["schema"]=="chesssim-real85-actual-guarded-neural-uci-v1"
          assert data["status"]=="ALL_REAL_UCI_GAMES_COMPLETE"
          assert len(data["games"])==16
          assert set(data["players"])=={"fischer","tal","karpov","kasparov"}
          assert not data["official_personality_files_changed"]
          assert not data["rated_official_games"]
          assert not data["historical_elo_estimated"]
          assert not data["maia_dsc_weights_changed"]
          assert len(data["rodent_original_sha256"])==len(data["stockfish_sha256"])==64
          assert all(g["status"]=="COMPLETED" for g in data["games"])
          for slug in data["players"]:
              games=[g for g in data["games"] if g["player"]==slug]
              assert len(games)==4
              assert {g["arm"] for g in games}=={"shadow","guided"}
              assert {g["color"] for g in games}=={"white","black"}
              assert sum(g["actual_overrides"] for g in games if g["arm"]=="shadow")==0
              print("REAL_NEURAL_GUARDED_UCI_PLAYER",slug,
                    "completed",len(games),
                    "guided_overrides",sum(g["actual_overrides"] for g in games
                                           if g["arm"]=="guided"),
                    "safe_candidates_seen",sum(g["safe_compared"] for g in games))
          overrides=sum(g["actual_overrides"] for g in data["games"])
          assert overrides>=1,"No neural move ever entered an actual full game"
          print("REAL_NEURAL_GUARDED_UCI_TOTALS",len(data["games"]),overrides)
          PY
      - name: Postgame Stockfish reanalysis of recorded games, separate from decision-time guard
        run: |
          python -m chesssim analyze-quality \
            --pgn "$RUNNER_TEMP/four-neural-uci/games.pgn" \
            --stockfish /usr/games/stockfish \
            --depth 10 --max-positions 128 --min-fullmove 8 --pv-plies 5 \
            --out "$RUNNER_TEMP/four-neural-postgame-quality.json"
          python - <<'PY'
          from pathlib import Path
          import json,os
          root=Path(os.environ["RUNNER_TEMP"])
          data=json.loads((root/"four-neural-postgame-quality.json").read_text())
          assert data["status"]=="EXPLORATORY_STRENGTH_DIAGNOSTIC_NOT_ELO"
          assert data["reconciliation"]["status"]=="CONSISTENT"
          assert data["independent_decisions_sampled"]>=32
          print("POSTGAME_STOCKFISH_REANALYSIS",data["summary"])
          PY
      - name: Preserve true game PGNs, immutable model hashes and reanalysis (never FIT raw PGNs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-real-neural-stockfish-guarded-uci-shared-controls
          path: |
            ${{ runner.temp }}/four-neural-trained/report.json
            ${{ runner.temp }}/four-neural-uci/results.json
            ${{ runner.temp }}/four-neural-uci/games.pgn
            ${{ runner.temp }}/four-neural-postgame-quality.json
          retention-days: 14
