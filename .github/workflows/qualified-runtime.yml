name: Qualified product runtime
on:
  pull_request:
    paths:
      - 'src/chesssim/qualified_runtime.py'
      - 'src/chesssim/data/qualified_game_assets.json'
      - 'tests/test_qualified_runtime.py'
      - '.github/workflows/qualified-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qualified-runtime-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/checkout@v5
        with:
          repository: nescitus/rodent-iv
          ref: e8d84c8c8c189a1cf4eb27c578fc573af3b916d2
          path: rodent-source
          persist-credentials: false
      - run: |
          python -m pip install -e '.[dev]'
          python -m ruff check src/chesssim/qualified_runtime.py tests/test_qualified_runtime.py
          python -m pytest -q tests/test_qualified_runtime.py tests/test_qualified_game_assets.py tests/test_product_karpov_repair.py tests/test_arena.py tests/test_cup_games.py tests/test_cups.py tests/test_leagues.py
          mkdir -p rodent-source/mac "$RUNNER_TEMP/rodent"
          make -C rodent-source/sources build
          cp rodent-source/mac/rodentIV "$RUNNER_TEMP/rodent/rodent-iv-plain.exe"
          cp -R rodent-source/personalities rodent-source/books "$RUNNER_TEMP/rodent/"
          python -m chesssim.qualified_runtime prepare --rodent "$RUNNER_TEMP/rodent"
          python -m chesssim.qualified_runtime check --rodent "$RUNNER_TEMP/rodent"
          CHESSSIM_QUALIFIED_RODENT="$RUNNER_TEMP/rodent" python -m pytest -q tests/test_qualified_runtime.py
