name: Python quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chesssim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate Linux/WSL bootstrap script
        run: |
          bash -n scripts/setup_linux_wsl.sh
          bash scripts/setup_linux_wsl.sh --help > /dev/null
          python scripts/verify_linux_wsl.py --help > /dev/null
      - name: Check installed dependencies
        run: python -m pip check
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run static analysis
        run: python -m ruff check src tests
      - name: Run unit tests and optional integration smoke tests
        run: python -m pytest -q -ra
      - name: Check command-line entry point
        run: |
          python -m chesssim --help
          chesssim --help
      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel
      - name: Verify wheel contents and installed CLI
        env:
          WHEEL_INSTALL: ${{ runner.temp }}/chesssim-wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, f"Expected one wheel, found {len(wheels)}"
          assert len(sdists) == 1, f"Expected one source distribution, found {len(sdists)}"
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              assert "chesssim/data/roster.json" in names, "Packaged roster is missing"
              import hashlib
              import json
              pieces_root = "chesssim/data/pieces/"
              source_pieces = json.loads(archive.read(pieces_root + "SOURCES.json"))
              assert source_pieces["upstream_commit"] == "104a754b35740129fade423f920ad6de965031dd"
              assert len(source_pieces["sets"]) == 7
              piece_files = set()
              for piece_set in source_pieces['sets']:
                  slug = piece_set["id"]
                  assert slug in {"cburnett", "merida", "chessnut", "fantasy",
                                  "spatial", "celtic", "rhosgfx"}
                  assert set(piece_set["files"]) == {
                      color + kind + ".svg" for color in "wb" for kind in "KQRBNP"
                  }
                  for filename, record in piece_set["files"].items():
                      piece_path = pieces_root + slug + "/" + filename
                      assert piece_path in names, "Missing SVG: " + piece_path
                      raw = archive.read(piece_path)
                      assert len(raw) == record["size"]
                      sha = hashlib.sha1(b"blob " + str(len(raw)).encode() +
                                         b"\\0" + raw, usedforsecurity=False).hexdigest()
                      assert sha == record["sha"], "Tampered SVG: " + piece_path
                      piece_files.add(piece_path)
              assert len(piece_files) == 84
              assert piece_files == {
                  name for name in names
                  if name.startswith(pieces_root) and name.endswith(".svg")
              }, "Orphan or missing SVGs in wheel"
              for license_file in ("GPL-2.0.txt", "Apache-2.0.txt",
                                   "MIT.txt", "CC0-1.0.txt"):
                  assert pieces_root + "licenses/" + license_file in names
              root = "chesssim/data/history/"
              history_packs = sorted(name for name in names
                                     if name.startswith(root) and name.endswith(".json")
                                     and name != root + "portrait_candidates.json")
              assert len(history_packs) == 64, f"Expected 64 biographies, got {len(history_packs)}"
              assert len(history_packs) <= 64, "More packs than canonical players"
              assert root + "portrait_candidates.json" in names
              baseline = {"anand", "bronstein", "carlsen", "euwe", "karpov",
                          "larsen", "mequinho", "najdorf", "petrosian", "smyslov",
                          "spassky", "timman", "topalov"}
              seen_slugs = set()
              referenced_photos = set()
              for biography in history_packs:
                  pack = json.loads(archive.read(biography))
                  slug = biography.removeprefix(root).removesuffix(".json")
                  assert pack["slug"] == slug and slug not in seen_slugs
                  seen_slugs.add(slug)
                  portrait = pack["portrait"]
                  if portrait is None:
                      continue
                  photograph = root + f"portraits/{slug}.jpg"
                  referenced_photos.add(photograph)
                  assert photograph in names, f"Packaged portrait missing: {slug}"
                  assert portrait["approval_status"] == "approved"
                  assert portrait["local_asset"] == f"history/portraits/{slug}.jpg"
                  assert hashlib.sha256(archive.read(photograph)).hexdigest() == portrait["sha256"]
                  assert portrait["license"] in ("CC0 1.0", "CC BY-SA 3.0", "CC BY-SA 2.0", "CC BY-SA 4.0", "CC BY 2.0", "Public Domain Mark 1.0")
              assert baseline.issubset(seen_slugs), "Baseline photo biographies missing"
              assert len(referenced_photos) >= len(baseline), "Baseline portraits missing"
              assert len(referenced_photos) == 64, "All 64 documented portraits must ship in the wheel"
              assert {root + f"portraits/{slug}.jpg" for slug in baseline}.issubset(referenced_photos)
              actual_photos = {n for n in names if n.startswith(root + "portraits/") and n.endswith(".jpg")}
              assert actual_photos == referenced_photos, "Orphan portraits or undisclosed photos in wheel"
              for asset in ("monitor.html", "monitor.css", "monitor.js",
                            "arena.html", "arena.css", "arena.js",
                            "history.js", "history.css", "history_replay.js", "history_stats.js",
                            "chess_board.js", "chess_board.css", "board_preferences.js"):
                  assert f"chesssim/data/{asset}" in names, f"Live-board asset missing: {asset}"
              entry_points = [
                  name for name in names
                  if name.endswith(".dist-info/entry_points.txt")
              ]
              assert len(entry_points) == 1, "Console entry-point metadata is missing"
              metadata = archive.read(entry_points[0]).decode("utf-8")
              assert "chesssim = chesssim.cli:main" in metadata, (
                  "chesssim console entry point is missing"
              )
              project_metadata = [
                  name for name in names if name.endswith(".dist-info/METADATA")
              ]
              assert len(project_metadata) == 1
              metadata_text = archive.read(project_metadata[0]).decode("utf-8")
              assert "License-Expression: GPL-3.0-or-later" in metadata_text
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
              assert any(name.endswith(".dist-info/licenses/NOTICE.md") for name in names)
          print(f"Verified {wheels[0].name} and {sdists[0].name}")
          PY
          python -m pip install --no-deps --target "$WHEEL_INSTALL" dist/*.whl
          PYTHONPATH="$WHEEL_INSTALL" python -m chesssim --help
          PYTHONPATH="$WHEEL_INSTALL" python -m chesssim roster > /dev/null
          PYTHONPATH="$WHEEL_INSTALL" python -m chesssim watch --help > /dev/null
          PYTHONPATH="$WHEEL_INSTALL" python -m chesssim arena --help > /dev/null

      - name: Generate resolved Python SBOM (single existing runner)
        if: matrix.python-version == '3.13' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        run: python scripts/generate_sbom.py --out sbom-artifacts
      - name: Publish SBOM and installed-dependency evidence for 7 days
        if: matrix.python-version == '3.13' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: resolved-sbom-py313
          path: sbom-artifacts/
          if-no-files-found: error
          retention-days: 7
