name: Python quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chesssim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate Linux/WSL bootstrap script
        run: |
          bash -n scripts/setup_linux_wsl.sh
          bash scripts/setup_linux_wsl.sh --help > /dev/null
          python scripts/verify_linux_wsl.py --help > /dev/null
      - name: Check installed dependencies
        run: python -m pip check
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run static analysis
        run: python -m ruff check src tests
      - name: Run unit tests and optional integration smoke tests
        run: python -m pytest -q -ra
      - name: Check command-line entry point
        run: |
          python -m chesssim --help
          chesssim --help
      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel
      - name: Verify wheel contents and installed CLI
        env:
          WHEEL_INSTALL: ${{ runner.temp }}/chesssim-wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, f"Expected one wheel, found {len(wheels)}"
          assert len(sdists) == 1, f"Expected one source distribution, found {len(sdists)}"
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              assert "chesssim/data/roster.json" in names, "Packaged roster is missing"
              entry_points = [
                  name for name in names
                  if name.endswith(".dist-info/entry_points.txt")
              ]
              assert len(entry_points) == 1, "Console entry-point metadata is missing"
              metadata = archive.read(entry_points[0]).decode("utf-8")
              assert "chesssim = chesssim.cli:main" in metadata, (
                  "chesssim console entry point is missing"
              )
              project_metadata = [
                  name for name in names if name.endswith(".dist-info/METADATA")
              ]
              assert len(project_metadata) == 1
              metadata_text = archive.read(project_metadata[0]).decode("utf-8")
              assert "License-Expression: GPL-3.0-or-later" in metadata_text
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
              assert any(name.endswith(".dist-info/licenses/NOTICE.md") for name in names)
          print(f"Verified {wheels[0].name} and {sdists[0].name}")
          PY
          python -m pip install --no-deps --target "$WHEEL_INSTALL" dist/*.whl
          PYTHONPATH="$WHEEL_INSTALL" python -m chesssim --help
          PYTHONPATH="$WHEEL_INSTALL" python -m chesssim roster > /dev/null

      - name: Generate resolved Python SBOM (single existing runner)
        if: matrix.python-version == '3.13' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        run: python scripts/generate_sbom.py --out sbom-artifacts
      - name: Publish SBOM and installed-dependency evidence for 7 days
        if: matrix.python-version == '3.13' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: resolved-sbom-py313
          path: sbom-artifacts/
          if-no-files-found: error
          retention-days: 7
