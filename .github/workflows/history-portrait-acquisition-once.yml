name: History portraits — one-shot acquisition

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - '.github/workflows/history-portrait-acquisition-once.yml'
      - 'src/chesssim/data/history/portrait_candidates.json'
      - 'scripts/materialize_history_portraits.py'

permissions:
  contents: write

jobs:
  acquire-six:
    if: ${{ github.event.pull_request.number == 55 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install image processor
        run: python -m pip install 'Pillow>=11,<13'
      - name: Try permitted original-download endpoints once
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from materialize_history_portraits import apply_photos, manifest_rows
          slugs = {"alekhine", "fischer", "marshall", "nimzowitsch", "reti", "kamsky"}
          apply_photos([row for row in manifest_rows() if row["slug"] in slugs])
          PY
      - name: Commit acquired images and provenance
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/chesssim/data/history/*.json src/chesssim/data/history/portraits/*.jpg
          if git diff --cached --quiet; then
            echo 'No acquired files'
          else
            git commit -m 'assets(history): materialize six verified portrait candidates (#47)'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
